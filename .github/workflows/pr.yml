name: PR

on:
  pull_request:
    branches: [ "main", "hack" ]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-arm64, macos-26 ]
    runs-on: ${{ matrix.os}}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.2'

    - name: install deps
      run: |
        sudo gem install fpm -f        

    - name: Configure Git to use GITHUB_TOKEN
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_PULL_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.0

    - name: Test
      run: make test

    - name: Build / Package
      run: make package
